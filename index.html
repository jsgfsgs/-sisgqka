<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد دعاء</title>

    <!-- تضمين Bootstrap و Animate.css و Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <!-- تخصيص CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <!-- خلفية جميلة لعيد الميلاد -->
    <div class="header text-center position-relative overflow-hidden">
        <img src="https://www.example.com/your-birthday-background.jpg" alt="عيد ميلاد دعاء" class="img-fluid rounded mb-4 parallax-effect">
        <h1 class="display-4 animate__animated animate__fadeInUp text-shadow">عيد ميلاد سعيد يا حبيبتي دعاء!</h1>
        <p class="lead animate__animated animate__fadeInUp text-shadow" style="animation-delay: 0.5s;">النهاردة يومكِ يا أحلى حاجة في حياتي!</p>
    </div>

    <!-- رسائل عيد الميلاد باللهجة المصرية -->
    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2 text-center">
                <div id="messages">
                    <!-- الرسائل هتظهر واحدة واحدة هنا -->
                </div>
                <div class="btn-container">
                    <button class="btn btn-danger btn-lg animate__animated animate__heartBeat pulse-btn" style="animation-delay: 10s;">أرسل لكِ كل الحب!</button>
                </div>
            </div>
        </div>
    </div>

    <!-- موسيقى عيد الميلاد -->
    <audio autoplay loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        متصفحك لا يدعم الصوت.
    </audio>

    <!-- تضمين مكتبات JavaScript (jQuery, Bootstrap, Popper.js) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
    
    <!-- Fireworks JS لتحسين الاحتفال -->
    <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.2.1/dist/fireworks.min.js"></script>
    <script>
        const fireworks = new Fireworks.default({
            speed: 1,
            acceleration: 1.05,
            friction: 0.97,
            gravity: 1.2,
            particles: 200,
            traceLength: 3,
            explosion: 5
        });
        fireworks.start();
    </script>

    <!-- JavaScript لعرض الرسائل كلمة كلمة -->
    <script>
        const messages = [
            "كل سنة وأنتِ طيبة يا عمري، النهاردة يوم عيد ميلادك، يومكِ أنتِ!",
            "حبيبي، كل سنة وأنتِ معايا، كل سنة وأنتِ أجمل من أي هدية.",
            "دعاء، أنتِ أحلى من أي كلام، وأنتِ السبب في سعادتي.",
            "النهاردة عيد ميلادك، بس كل يوم معاكِ هو عيد، يا أغلى من أي حاجة.",
            "حبيبي، كل سنة وأنتِ بخير، وأنتِ ملكة قلبي اللي مفيش زيها.",
            "كل لحظة معاكِ هي أحلى لحظة في حياتي، وأنا مش قادر أعيش من غيرك.",
            "عيد ميلاد سعيد يا حبي، يا أجمل هدية جت في حياتي، وكل سنة وأنتِ في حياتي.",
            "دعاء، عمري ما كنت أتخيل إن في يوم هعيش مع واحدة زيك، كل سنة وأنتِ دايمًا معايا.",
            "عيد ميلاد سعيد يا حب عمري، اليوم ده لو كُنتِ قدامي كنت هقولك 'أنتِ حياتي'.",
            "يا أجمل من الورد، يا أحلى من الشوكولاتة، كل سنة وأنتِ أجمل من السنة اللي فاتت.",
            "النهاردة أكيد الدنيا كلها بتحتفل بيكِ، علشان أنتي أجمل حاجة في الحياة.",
            "دعاء، أنا بعيش في لحظة كل يوم معاكِ، وكل عيد ميلاد وأنتِ بخير وبألف خير.",
            "النهاردة مش بس عيد ميلادك، ده كمان عيد حبي، عيد قلبي.",
            "كل سنة وأنتِ طيبة، وكل سنة وأنتِ أحلى من السنة اللي قبلها.",
            "دعاء، في عيد ميلادك ده، عايز أقولك إنك نعمة كبيرة في حياتي، وكل لحظة معاكِ مش ممكن توصف.",
            "كل سنة وأنتِ في قلبي، وكل سنة وأنتِ الحب اللي ماينتهيش.",
            "عيد ميلاد سعيد يا حب عمري، حبي ليكِ أكبر من كل الكلمات.",
            "الليلة دي أجمل من أي ليلة في حياتي، كل سنة وأنتِ سبب سعادتي.",
            "يا أجمل من الشمس، وأحلى من القمر، كل لحظة معاكِ بتخليني أعيش في عالم تاني.",
            "إنتِ مش بس حب، إنتِ الحياة نفسها، كل عيد ميلاد وأنتِ دايمًا في حضني.",
            "يا حبيبة قلبي، إنتِ أجمل حاجة في الدنيا، وفي عيد ميلادك أنا محتفل بكل لحظة معاكِ.",
            "لو عرفت الدنيا كلها إزاي، مفيش زيك في الدنيا، كل سنة وأنتِ معايا.",
            "كل سنة وأنتِ حبي، وكل سنة وأنتِ الملكة الوحيدة في حياتي."
        ];

        function showMessages(messages) {
            let index = 0;
            const messageContainer = document.getElementById('messages');

            function showNextMessage() {
                if (index < messages.length) {
                    let currentMessage = messages[index];
                    let chars = currentMessage.split('');
                    let charIndex = 0;
                    let messageDiv = document.createElement('p');
                    messageDiv.classList.add('message');
                    messageContainer.appendChild(messageDiv);

                    function addChar() {
                        if (charIndex < chars.length) {
                            messageDiv.innerHTML += chars[charIndex];
                            charIndex++;
                            setTimeout(addChar, 100); // Delay between characters
                        } else {
                            index++;
                            setTimeout(showNextMessage, 500); // Delay between messages
                        }
                    }

                    addChar();
                }
            }

            showNextMessage();
        }

        showMessages(messages);
    </script>
</body>
</html>
